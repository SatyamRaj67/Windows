<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>This PC</title>
    <link
      rel="stylesheet"
      href="../../../global.css"
    />
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <!-- === HEADER === -->
    <header>
      <div class="buttons">
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-move-left-icon lucide-move-left"
          >
            <path d="M6 8L2 12L6 16" />
            <path d="M2 12H22" />
          </svg>
        </button>
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-move-right-icon lucide-move-right"
          >
            <path d="M18 8L22 12L18 16" />
            <path d="M2 12H22" />
          </svg>
        </button>
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-move-up-icon lucide-move-up"
          >
            <path d="M8 6L12 2L16 6" />
            <path d="M12 2V22" />
          </svg>
        </button>
      </div>
      <div class="folderBx">
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-monitor-icon lucide-monitor"
          >
            <rect
              width="20"
              height="14"
              x="2"
              y="3"
              rx="2"
            />
            <line
              x1="8"
              x2="16"
              y1="21"
              y2="21"
            />
            <line
              x1="12"
              x2="12"
              y1="17"
              y2="21"
            />
          </svg>
        </button>
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-right-icon lucide-chevron-right"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
        <button disabled>Recycle Bin</button>
        <button disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-right-icon lucide-chevron-right"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
      <div class="searchBx">
        <input
          type="text"
          placeholder="Search Recycle Bin"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-search-icon lucide-search"
        >
          <path d="m21 21-4.34-4.34" />
          <circle
            cx="11"
            cy="11"
            r="8"
          />
        </svg>
      </div>
    </header>
    <main>
      <nav>
        <ul class="main">
          <li>
            <div class="icon">
              <img src="../../../public/Windows Icons/Home.ico" alt="Home">
            </div>
            <p>Home</p>
          </li>
        </ul>
        <ul class="folder-list" id="folder-list">
          <li >
            <div class="icon">
              <img src="../../../public/Windows Icons/Computer.ico" alt="This PC">
            </div>
            <p>This PC</p>
          </li>
          <li>
            <div class="icon">
              <img src="../../../public/Windows Icons/Trash Full.ico" alt="Recycle Bin">
            </div>
            <p>Recycle Bin</p>
          </li>
          <li class="active">
            <div class="icon">
              <img src="../../../public/Windows Icons/Trash Full.ico" alt="Recycle Bin">
            </div>
            <p>Recycle Bin</p>
          </li>
          <li>
            <div class="icon">
              <img src="../../../public/Windows Icons/Trash Full.ico" alt="Recycle Bin">
            </div>
            <p>Recycle Bin</p>
          </li>
        </ul>
      </nav>
      <article></article>
      <aside></aside>
    </main>
  </body>
  <script src="script.js"></script>
</html>
